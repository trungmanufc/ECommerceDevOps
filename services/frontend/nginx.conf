server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Used by the Kubernetes liveness/readiness probes.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # The browser only ever talks to this nginx. Requests under /api/ are
    # forwarded to the backend services, which are reachable by name both in
    # Docker Compose and in Kubernetes.
    #   /api/products/3  ->  http://product-service:3000/products/3
    location /api/products {
        proxy_pass http://product-service:3000/products;
    }

    location /api/cart {
        proxy_pass http://cart-service:3000/cart;
    }

    location /api/orders {
        proxy_pass http://order-service:3000/orders;
    }
}
