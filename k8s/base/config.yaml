# Non-secret settings shared by the services, injected as environment variables.
apiVersion: v1
kind: ConfigMap
metadata:
  name: shop-config
data:
  PGHOST: postgres
  PGDATABASE: shop
  PGUSER: shop
  REDIS_URL: redis://redis:6379
  CART_SERVICE_URL: http://cart-service:3000
  PRODUCT_SERVICE_URL: http://product-service:3000
---
# Local-development password only. The AWS overlay removes this Secret, and
# the real one is created by hand on the server (see docs/aws-k3s.md).
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
type: Opaque
stringData:
  password: shop-local-password
