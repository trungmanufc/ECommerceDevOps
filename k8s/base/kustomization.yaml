# The "base": the manifests shared by every environment. It is not deployed
# directly; an overlay picks it up and adds what is specific to one place:
#   k8s/kustomization.yaml       local Kubernetes in Docker Desktop
#   k8s/aws/kustomization.yaml   k3s on an EC2 server
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Every resource below is created in this namespace.
namespace: shop

resources:
  - namespace.yaml
  - config.yaml
  - postgres.yaml
  - redis.yaml
  - product-service.yaml
  - cart-service.yaml
  - order-service.yaml
  - frontend.yaml
