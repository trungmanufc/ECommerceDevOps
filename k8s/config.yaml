# Non-secret settings shared by the services, injected as environment variables.
apiVersion: v1
kind: ConfigMap
metadata:
  name: shop-config
data:
  PGHOST: postgres
  PGDATABASE: shop
  PGUSER: shop
  REDIS_URL: redis://redis:6379
  CART_SERVICE_URL: http://cart-service:3000
  PRODUCT_SERVICE_URL: http://product-service:3000
---
# Local-development password only. For AWS this Secret must not live in git:
# it will be created from AWS Secrets Manager or by the pipeline instead.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
type: Opaque
stringData:
  password: shop-local-password
