# The AWS version of the shop. It is an "overlay": it reuses every manifest
# in k8s/base and changes only what differs on AWS.
#
# Deploy (on the EC2 server):   kubectl apply -k k8s/aws
# Preview the result:           kubectl kustomize k8s/aws
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Start from the shared manifests.
resources:
  - ../base

# Difference 1: use the images that GitHub Actions pushed to GHCR, instead of
# the ones built on your laptop. "latest" is the newest build of main; the CD
# step will later replace it with an exact sha-<commit> tag.
images:
  - name: product-service
    newName: ghcr.io/trungmanufc/ecommercedevops/product-service
    newTag: latest
  - name: cart-service
    newName: ghcr.io/trungmanufc/ecommercedevops/cart-service
    newTag: latest
  - name: order-service
    newName: ghcr.io/trungmanufc/ecommercedevops/order-service
    newTag: latest
  - name: frontend
    newName: ghcr.io/trungmanufc/ecommercedevops/frontend
    newTag: latest

patches:
  # Difference 2: do not deploy the local-development password from git.
  # On the server you create this Secret by hand instead (see docs/aws-k3s.md),
  # so the real password never appears in the repository.
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: Secret
      metadata:
        name: postgres-credentials

  # Difference 3: serve the shop on the normal web port 80, so the address is
  # simply http://<server-ip>. k3s publishes a LoadBalancer Service on the
  # server's own network card.
  - target:
      kind: Service
      name: frontend
    patch: |-
      - op: replace
        path: /spec/ports/0/port
        value: 80
