# The local version of the shop, for Kubernetes in Docker Desktop.
# Deploy everything:   kubectl apply -k k8s
# Remove everything:   kubectl delete -k k8s
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# All the shared manifests (see base/kustomization.yaml).
resources:
  - base

# The manifests use short image names. This block maps them to the images
# built on your laptop by "docker compose build". The AWS overlay maps the
# same names to the images pushed by GitHub Actions instead.
images:
  - name: product-service
    newName: ecommerce-shop/product-service
    newTag: local
  - name: cart-service
    newName: ecommerce-shop/cart-service
    newTag: local
  - name: order-service
    newName: ecommerce-shop/order-service
    newTag: local
  - name: frontend
    newName: ecommerce-shop/frontend
    newTag: local
