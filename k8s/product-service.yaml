apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: product-service
  template:
    metadata:
      labels:
        app: product-service
    spec:
      containers:
        - name: product-service
          image: product-service   # replaced by the "images" block in kustomization.yaml
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: shop-config
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: password
          # Readiness: only send traffic to this pod when it can reach the database.
          readinessProbe:
            httpGet:
              path: /readyz
              port: 3000
            periodSeconds: 5
          # Liveness: restart the container if the process stops responding.
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: product-service
spec:
  selector:
    app: product-service
  ports:
    - port: 3000
      targetPort: 3000
