on:
  push:
  pull_request:

jobs:
  test:
    name: Test 
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: 
        service: [cart-service, order-service, product-service]
    defaults:
      run:
        working-directory: services/${{matrix.service}}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 23
          package-manager-cache: false
      - run: npm ci
      - run: npm test

  build:
    name: Build ${{matrix.service}}
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: 
        service: [cart-service, product-service, order-service, frontend]
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Github Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with: 
          registry: ghcr.io
          username: ${{github.actor}}
          password: ${{secrets.GITHUB_TOKEN}}
      
      - name: Tagging images
        id: meta
        uses: docker/metadata-action@v5
        with: 
          images: ghcr.io/${{github.repository}}/${{matrix.service}}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: services/${{matrix.service}}
          push: ${{github.event_name != 'pull_request'}}
          tags: ${{steps.meta.outputs.tags}}
          labels: ${{steps.meta.outputs.labels}}   
  
  deploy:
    name: Deploy to EC2
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' 
    steps:
      - uses: actions/checkout@v7

      - name: Set up ssh
        run: |
          mkdir -p ~/.ssh
          echo "${{secrets.EC2_SSH_KEY}}" > ~/.ssh/key
          chmod 400 ~/.ssh/key
          ssh-keyscan -H ${{secrets.EC2_HOST}} >> ~/.ssh/known_hosts          
      
      - name: Copy compose file to the server
        run: scp -i ~/.ssh/key docker-compose-prod.yml ${{secrets.EC2_USER}}@${{secrets.EC2_HOST}}:shop

      - name: Pull the new images and restart
        run: |
          ssh -i ~/.ssh/key ${{secrets.EC2_USER}}@${{secrets.EC2_HOST}} "
            cd shop &&
            export IMAGE_TAG=sha-${{github.sha}} &&
            docker compose -f docker-compose-prod.yml pull &&
            docker compose -f docker-compose-prod.yml up -d --remove-orphans &&
            docker image prune -f
          "




