name: ecommerce-shop

services:
  database:
    image: postgres:19-alpine
    restart: unless-stopped
    environment: 
      POSTGRES_DB: shop
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: 
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop -d shop"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  product-service:
    image: ghcr.io/${IMAGE_REPO}/product-service:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGDATABASE: shop
      PGUSER: shop
      PGPASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      database:
        condition: service_healthy

  cart-service:
    image: ghcr.io/${IMAGE_REPO}/cart-service:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    
  order-service:
    image: ghcr.io/${IMAGE_REPO}/order-service:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGDATABASE: shop
      PGUSER: shop
      PGPASSWORD: ${POSTGRES_PASSWORD}
      CART_SERVICE_URL: http://cart-service:3000
      PRODUCT_SERVICE_URL: http://product-service:3000
    depends_on:
      database:
        condition: service_healthy
  
  frontend:
    image: ghcr.io/${IMAGE_REPO}/frontend:${IMAGE_TAG}
    restart: unless-stopped
    ports:
      - "9000:80"
    depends_on:
      - product-service
      - order-service
      - cart-service

volumes:
  postgres: